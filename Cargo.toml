[package]
name = "jdbkmoria"
version = "0.1.0"
edition = "2021"
description = "Rust port of Umoria - Robert A. Koeneke's classic dungeon crawler, The Dungeons of Moria"
license = "GPL-3.0-or-later"
repository = "https://github.com/dungeons-of-moria/umoria"
authors = [
    "Robert A. Koeneke (original Moria)",
    "James E. Wilson (Umoria)",
    "Umoria contributors (see AUTHORS)",
]

[dependencies]
libc = "0.2.186"
pancurses = { version = "0.17", features = ["wide"] }

[profile.release]
opt-level = 3
